<style>

.m1{height:72px;background:#7ad2c7}.m2{height:106px;background:#8c72ca}.m3{height:142px;background:#25b8b9}.m4{height:116px;background:#ecc35a}.m5{height:88px;background:#5e91d6}

.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.role{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:9px;text-align:left}.role:hover{transform:translateY(-2px);border-color:var(--teal)}
.role .icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px}.role:nth-child(1) .icon{background:#eaf9f8}.role:nth-child(2) .icon{background:#fff7df}.role:nth-child(3) .icon{background:#ede9ff}.role:nth-child(4) .icon{background:#eaf2ff}.note{margin-top:18px;padding:12px 16px;border-radius:14px;background:#fff8e8;border:1px solid #ffe09f;color:#7c5e20;font-size:13px;line-height:1.5}
.shell{display:flex;min-height:100vh}.sidebar{width:280px;background:var(--navy);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.sidebar .brand{font-size:24px;padding:4px 10px}.side-title{padding:20px 12px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#96b1d8;font-weight:800}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:#d6e2f7;text-align:left;border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:12px;font-weight:700}.nav button:hover,.nav button.active{background:#21406f;color:#fff}.nav .i{width:22px;text-align:center}

.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;min-width:0}.card h3{margin:0 0 10px;font-size:18px;color:var(--navy);letter-spacing:-.02em}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.stat strong{display:block;font-size:31px;color:var(--navy);letter-spacing:-.05em}.stat span{font-size:13px;color:var(--muted)}

.stage-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.stage{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:8px;min-height:254px}.stage:hover{border-color:#74d4d4;transform:translateY(-2px)}.num{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff}

<style>

<style>
/* Extensión OSO 5.0: continuidad y match educativo */
.scope-hint{border:1px solid #c8ddeb;background:#edf6fc;color:#416280;border-radius:12px;padding:13px 15px;font-size:12px;line-height:1.55;margin-top:18px}
.pathway{display:flex;align-items:stretch;gap:7px;flex-wrap:wrap;padding:13px 0}.pathnode{flex:1;min-width:88px;padding:11px 8px;border:1px solid #e2e9f2;border-radius:13px;background:#f7f9fc;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:#687e95}.pathnode span{display:grid;place-items:center;border-radius:100%;height:28px;width:28px;background:#e2e8f2;color:#47617a;font-weight:900}.pathnode strong{font-size:11px;line-height:1.3}.pathnode.pathdone{background:#ecf9f4;border-color:#bfeada;color:#17674f}.pathdone span{background:#2eae82;color:white}.patharrow{align-self:center;color:#95a9bd}
.highlightline{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #edf1f6;padding:12px 0;font-size:13px}.highlightline span{color:#5e7490}.highlightline strong{text-align:right;color:#203f64}.option-card{display:flex;flex-direction:column;gap:10px}.option-card h3{font-size:20px}.option-card ul{margin:4px 0;padding-left:19px;font-size:12px;color:#637b95;line-height:1.55}.uni-name{color:#1c7d86;font-weight:800;font-size:14px}.module-card{border:1px solid #e3eaf2;border-radius:14px;background:#fbfefd;padding:17px;display:flex;flex-direction:column;gap:10px}.module-card>span{font-size:22px}.module-card strong{font-size:14px;color:#17376b}.module-card p{margin:0}.mini-select{padding:8px 9px;border:1px solid #ccd9e8;background:white;min-width:130px;max-width:260px;border-radius:10px;color:#1e3c58;font-size:12px}
.matchmini{border:1px solid #e4eaf4;border-radius:14px;padding:14px;background:#fcfdff;min-width:0;display:flex;flex-direction:column;gap:9px}.matchmini h4{margin:2px 0;font-size:14px;color:#17366a}.matchmini p{font-size:12px;color:#637d91;margin:0;line-height:1.45}.matchmini .btn{margin-top:auto}.stat-tile{background:#f2f8fc;border:1px solid #dbe9f3;border-radius:13px;padding:14px}.stat-tile strong{font-size:26px;display:block;color:#113263}.stat-tile span{font-size:12px;color:#647a96}.transition-section{border:1px solid #dce8ef;background:linear-gradient(120deg,#f8fdfc,#f0f6fd);padding:20px;border-radius:19px}
.engineicon{height:47px;width:47px;border-radius:13px;background:#e7f8f5;display:grid;place-items:center;font-size:24px;margin-bottom:12px}.engine p{font-size:13px;color:#59738e;line-height:1.6}.pipeline{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.pipeline div{padding:14px;border:1px solid #d6e5ef;background:#f5fafb;border-radius:11px;font-size:12px;font-weight:800;color:#2a5876}.pipeline span{color:#8da9b8}.signal-item{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #e6edf3;padding:14px 0}.signal-item strong{color:#17366a;font-size:13px}.signal-item p{font-size:12px;color:#6d819a;line-height:1.5;margin:5px 0}.signal-item .btn{flex-shrink:0}.task-card{padding:14px 0;border-bottom:1px solid #e6edf4}.task-card p{margin:5px 0 10px}.module-toggle{display:flex;gap:12px;align-items:center;padding:15px;border-bottom:1px solid #e8eef2;font-size:14px;color:#21405f}.module-toggle input{width:17px;height:17px;accent-color:#21a59d}
@media(max-width:850px){.pathnode{flex:1 1 31%;min-width:120px}.patharrow{display:none}.pipeline div{flex:1 1 38%}.signal-item{align-items:flex-start;flex-direction:column}.mini-select{max-width:100%}.highlightline{align-items:flex-start;flex-direction:column;gap:4px}.highlightline strong{text-align:left}}
</style>
<style>
/* OSO 5.1 · Seguimiento de competencias sin puntajes técnicos en la vista juvenil */
.skills-student-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.skill-student-item{display:flex;flex-direction:column;gap:10px;border:1px solid #e5edf6;border-radius:17px;padding:16px;background:#fcfefe;min-width:0}
.skill-student-item strong{font-size:14px;color:var(--navy);min-height:36px}
.skill-student-item p{font-size:12px;color:#506b84;line-height:1.52;margin:0}
.skill-icon{width:46px;height:46px;border-radius:13px;background:#e5f8f7;display:grid;place-items:center;font-size:24px}
.skill-small-tip{border-top:1px solid #e3ebf4;padding-top:10px;font-size:12px;color:#497282;line-height:1.45;flex:1}
.skill-small-owner{font-size:11px;color:#7588a1;margin-top:auto}
.skill-chart-item{border-top:1px solid #e9eef5;padding:12px 0}
.skill-chart-item .head{margin-bottom:8px}
.skill-chart-row{display:grid;grid-template-columns:48px 1fr 28px;gap:10px;align-items:center;font-size:12px;margin:7px 0;color:#678099}
.skill-chart-row .progress{height:11px}
.skill-alert{padding:12px 0;border-bottom:1px solid #eaf0f6}.skill-alert p{font-size:12px;color:#6a7f98;margin:6px 0 8px}.skill-alert .badge{white-space:normal;line-height:1.4}
.skill-number{max-width:116px;border:1px solid #d2dfee;border-radius:9px;padding:9px 10px;color:#193653;font-size:13px}
@media(max-width:1400px){.skills-student-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.skills-student-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.skills-student-grid{grid-template-columns:1fr}.skill-student-item strong{min-height:0}}
</style>
</head>

function student(){return db.students[0]}
function stageBy(id){return STAGES.find(s=>s.id===id)}
function safe(v){return String(v||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function submittedCount(s){return STAGES.filter(t=>s.submissions[t.id]?.status==='submitted' || s.submissions[t.id]?.status==='approved').length}
function approvedCount(s){return STAGES.filter(t=>s.submissions[t.id]?.status==='approved').length}
function progressPct(s){return Math.round((submittedCount(s)/STAGES.length)*100)}
function sharedStats(){
  const sample=db.students.length;
  const diagnosed=1840, withOrientation=1320, referred=318, admitted=142;
  return {sample, diagnosed, withOrientation, referred, admitted};
}
function toast(msg){const t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;right:18px;bottom:18px;background:#173974;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 10px 22px rgba(0,0,0,.18);z-index:9999;font-size:13px';document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function loginView(){return `<div class="login"><div class="login-left"><div class="oso-cover-card"><img src="${OSO_COVER_IMAGE}" alt="Portada original de la cartilla ¿Quién soy y pa’ dónde voy?: montañas violetas con cumbres nevadas, cielo turquesa y la travesía hacia el autoconocimiento"/></div></div><div class="login-right"><div class="panel"><div class="platform-badge">🧭 EXPERIENCIA DIGITAL OSO · ENSEÑA POR COLOMBIA + EDUCAMÁS</div><h2>¿Quién soy y pa’ dónde voy?</h2><p class="panel-tagline">Tu viaje de autoconocimiento comienza aquí.</p><h3 class="select-role-title">Elige un rol para explorar el prototipo</h3><p>Elige joven, Eco/docente o una de las organizaciones. Cada perfil tiene herramientas diferentes para aprender, orientar y acompañar trayectorias.</p><div class="role-grid">${Object.entries(USERS).map(([id,u])=>`<button class="role" data-login="${id}"><div class="icon">${iconRole(id)}</div><strong>${u.role==='joven'?'Joven':u.role==='eco'?'Eco / docente':u.role==='ensena'?'Enseña por Colombia':'Educamás'}</strong><div>${u.name}</div><small>${roleDesc(id)}</small></button>`).join('')}</div><div class="note"><strong>Importante:</strong> es un prototipo demostrativo. Los registros, escuelas y trayectorias son ficticios. El "motor IA" es una simulación explicable por reglas, con validación humana del Eco/docente.</div></div></div></div>`}
function iconRole(id){return ({joven:'🧭',eco:'🧑‍🏫',ensena:'🏫',educamas:'📊'})[id]}
function roleDesc(id){return ({joven:'Completa la cartilla digital, recibe orientación y sigue tu transición.',eco:'Acompaña jóvenes, revisa evidencias y valida rutas sugeridas.',ensena:'Monitorea implementación en colegios, Ecos e indicadores del proceso.',educamas:'Monitorea cohortes, embudo de transición y remisiones a continuidad.'})[id]}
function legacyShell(){const young=user().role==='joven';return `<div class="shell ${young?'student-shell':''}"><aside class="sidebar"><div class="brand"><div class="mark">ó</div> OSO 5.0</div><div class="side-title">${young?'Mi aventura':'Navegación de gestión'}</div><div class="nav">${navButton('home','🏠','Inicio')}${young?navButton('miRuta','🗺️','Mi cuaderno OSO'):''}${young?navButton('motor','✨','Explorar mi futuro'):''}${young?navButton('equipaje','🎒','Mi equipaje'):''}${!young?navButton('cohort','👥','Cohorte y seguimiento'):''}${!young&&user().role==='eco'?navButton('revision','✅','Revisar evidencias'):''}${!young?navButton('indicadores','📈','Indicadores'):''}${!young?navButton('decisiones','🧠','Guía para orientar'):''}${navButton('cartilla','📕','Cartilla base')}</div><div class="userbox"><div class="person"><div class="avatar">${user().avatar}</div><div><strong>${user().name}</strong><small>${labelRole(user().role)} · ${user().territory}</small></div></div><button class="switch" data-reset="1">Restablecer demo</button><button class="switch" data-logout="1">Cambiar de rol</button></div></aside><main class="main"><div class="top"><div class="crumb">OSO / <strong>${crumbTitle()}</strong></div><div class="row">${young?`<span class="pill ok">🌱 Tu voz guía el camino</span><span class="pill info">Acompañamiento de tu Eco</span>`:`<span class="pill ok">✔ Instrumentos de la cartilla</span><span class="pill info">20 Ecos · 5 instituciones</span><span class="pill warn">Orientación revisada por personas</span>`}</div></div><div class="content">${renderPage()}<div class="footer">Prototipo demostrativo con usuarios ficticios. Adaptación metodológica de «¿Quién soy y pa' dónde voy?» (Enseña por Colombia, 2020), basada en Fundación Corona y Enseña por Colombia, CC BY-NC-SA 4.0. Las ideas que genera este demo utilizan reglas sencillas, <strong>no IA real</strong>, ni sustituyen la decisión del joven y de su orientador. Los datos se guardan únicamente en este navegador.</div></div></main></div>`}

function labelRole(r){return r==='joven'?'Joven':r==='eco'?'Eco / docente':r==='ensena'?'Enseña por Colombia':'Educamás'}
function navButton(id,icon,label){return `<button class="${page===id?'active':''}" data-nav="${id}"><span class="i">${icon}</span>${label}</button>`}
function previousCrumbTitle(){return ({home:'Inicio',miRuta:'Mi cuaderno OSO',motor:'Explorar mi futuro',equipaje:'Mi equipaje',cohort:'Cohorte y seguimiento',revision:'Revisión pedagógica',indicadores:'Indicadores',decisiones:'Apoyo a decisiones',cartilla:'Cartilla base'})[page] || 'Inicio'}
function previousRenderPage(){const young=user().role==='joven';if(young&&!['home','miRuta','motor','equipaje','cartilla'].includes(page))page='home';if(!young&&['miRuta','motor','equipaje'].includes(page))page='home';if(user().role!=='eco'&&page==='revision')page='home';switch(page){case 'home':return homePage();case 'miRuta':return routePage();case 'motor':return studentOrientationPage(student());case 'equipaje':return equipajePage();case 'cohort':return cohortPage();case 'revision':return teacherReviewPage();case 'indicadores':return indicatorsPage();case 'decisiones':return decisionsPage();case 'cartilla':return cartillaPage();default:return homePage()}}

function homePage(){return user().role==='joven'?homeStudent():homeOrg()}
function previousHomeStudent(){const s=student();const next=STAGES.find(t=>s.submissions[t.id]?.status!=='approved')||STAGES[4];return `<div class="page-kicker">MI CUADERNO DE VIAJE</div><h1 class="title">¡Hola, ${safe(s.name.split(' ')[0])}! ✨</h1><p class="lede">Aquí no hay respuestas buenas ni malas. Vas a descubrir qué es importante para ti y qué opciones quieres explorar. Un Eco te acompañará durante el recorrido.</p><section class="hero"><div><div class="page-kicker">¿Quién soy y pa' dónde voy?</div><h2>Tu camino empieza subiendo tu propia montaña.</h2><p>Cada trayecto te ayuda a entender tu historia, tus apoyos, tus capacidades y tus sueños. La guía te acompaña paso a paso para que explores caminos de estudio con apoyo de tu Eco y de las personas que elijas.</p><div class="row"><button class="btn accent" data-stage="${next.id}">Continuar: ${safe(next.short)} →</button><button class="btn secondary" data-nav="motor">✨ Explorar mis opciones</button></div></div><div class="hero-mountain"><img src="${OSO_MOUNTAIN_IMAGE}" alt="Montañas de la cartilla OSO que simbolizan el recorrido de autoconocimiento"/><div class="hero-mountain-caption">🗺️ Historia → Familia → Capacidades → Sueños → Plan</div></div></section><div style="height:18px"></div><div class="student-highlights"><div class="card"><div class="little-emoji">📔</div><strong>${submittedCount(s)} de 5</strong><span>Trayectos compartidos con tu Eco</span></div><div class="card"><div class="little-emoji">🎟️</div><strong>${approvedCount(s)}</strong><span>Tiquetes de viaje recibidos</span></div><div class="card"><div class="little-emoji">🧑‍🏫</div><strong>${safe(s.eco.split(' ')[0])}</strong><span>Tu Eco está para acompañarte</span></div></div><div style="height:20px"></div>${journeyMap(true)}<div style="height:20px"></div><div class="grid g2"><div class="card"><h3>✨ Una guía que aprende de lo que compartes</h3><p class="muted">Mientras avanzas, te ayuda a ordenar tus ideas, encontrar preguntas para conversar y explorar más de un camino educativo. No adivina tu futuro ni te pone notas.</p>${studentCoach(s,next.id)}<div class="row" style="margin-top:14px"><button class="btn accent" data-nav="motor">Explorar caminos</button></div></div><div class="card"><h3>🎒 Mi equipaje de viaje</h3><p class="small muted">Seis herramientas para acompañarte en cada trayecto.</p>${symbols(null,true)}<div class="row" style="margin-top:16px"><button class="btn secondary" data-nav="equipaje">Conocer todo mi equipaje →</button></div></div></div>`}

function previousHomeOrg(){const s=sharedStats(); return `<div class="page-kicker">Tablero compartido</div><h1 class="title">${user().role==='eco'?'Acompañamiento de mi grupo':user().role==='ensena'?'Seguimiento de implementación en colegios':'Seguimiento de cohortes y tránsito educativo'}</h1><p class="lede">El tablero combina metas del proyecto, registros simulados y señales derivadas de la cartilla OSO. Así se puede pasar de actividades realizadas a decisiones de acompañamiento y continuidad.</p><section class="hero"><div><div class="page-kicker">Meta del proyecto</div><h2>Una ruta compartida: 2.400 jóvenes acompañados para avanzar hacia la continuidad educativa</h2><p>La metáfora de la montaña ayuda a mostrar que la orientación no ocurre en un solo momento. Cada trayecto suma información útil para comprender mejor a cada joven y acompañar decisiones de transición con más criterio.</p><div class="row"><button class="btn accent" data-nav="indicadores">Ver indicadores</button><button class="btn secondary" data-nav="decisiones">Ver alertas y decisiones</button></div></div><div class="hero-mountain"><img src="${OSO_MOUNTAIN_IMAGE}" alt="Montañas de la cartilla OSO que simbolizan el recorrido de autoconocimiento"/><div class="hero-mountain-caption">🗺️ Historia → Familia → Capacidades → Sueños → Plan</div></div></section><div style="height:18px"></div><div class="metrics"><div class="metric"><strong>${db.metas.diagnosticos}</strong><span>Meta de jóvenes diagnosticados</span></div><div class="metric"><strong>${s.diagnosed}</strong><span>Diagnósticos simulados</span></div><div class="metric"><strong>${db.metas.ecos}</strong><span>Ecos con acceso</span></div><div class="metric"><strong>${db.metas.instituciones}</strong><span>Instituciones vinculadas</span></div><div class="metric"><strong>${db.metas.aliados}</strong><span>Organizaciones aliadas</span></div></div><div style="height:18px"></div><div class="grid g2"><div class="card"><div class="head"><h3>Embudo de transición</h3><span class="badge green">${db.metas.objetivoTransito} cupos meta Año 12</span></div>${funnel()}</div><div class="card"><div class="head"><h3>Señales que salen de la cartilla</h3><span class="badge purple">Para seguimiento y decisión</span></div>${signalTable()}</div></div><div style="height:18px"></div>${journeyMap(false)}`}
function journeyMap(studentMode){return `<div class="card"><div class="head"><div><h3>${studentMode?'Tu camino hacia la cima':'Recorrido pedagógico OSO'}</h3><div class="small muted">${studentMode?'Cinco paradas para conocerte, imaginar opciones y planear tu próximo paso.':'Los cinco trayectos producen evidencias orientadoras, que siempre revisa una persona.'}</div></div>${studentMode?`<span class="badge yellow">${submittedCount(student())} de 5 compartidos</span>`:`<span class="badge">Metodología común</span>`}</div><div class="stage-grid">${STAGES.map(st=>stageCard(st,studentMode)).join('')}</div></div>`}
function stageCard(st,studentMode){const s=student(),rec=s.submissions[st.id],status=rec.status;return `<div class="stage"><div class="num ${st.color}">${st.n}</div><h3>${safe(st.short)}</h3><p>${safe(st.purpose)}</p><div class="badge ${badgeClass(status)}">${studentMode?statusLabel(status):'Actividad + evidencia'}</div>${studentMode?`<div style="margin-top:auto"><button class="btn sm secondary" data-stage="${st.id}">${status==='approved'?'Volver a mi trayecto':'Entrar al trayecto'} →</button></div>`:`<p>${safe(indicatorText(st.id))}</p>`}</div>`}

function indicatorText(id){return ({historia:'Mide autoconocimiento narrativo, resiliencia y claridad de hitos.',familia:'Mide red de apoyo, conversación familiar y alineación de expectativas.',capacidades:'Mide identificación de habilidades y competencias a fortalecer.',suenos:'Mide claridad vocacional, oportunidades percibidas y barreras.',plan:'Mide capacidad de plan de acción, apoyo requerido y preparación para la transición.'})[id]}
const KIT=[{id:'lupa',ico:'🔎',title:'Lupa',desc:'Te ayuda a comprender palabras nuevas del viaje.'},{id:'cuaderno',ico:'📔',title:'Cuaderno',desc:'Guarda tus ideas, recuerdos y descubrimientos.'},{id:'linterna',ico:'🔦',title:'Linterna',desc:'Es una pausa para escucharte y reflexionar.'},{id:'carpa',ico:'⛺',title:'Carpa',desc:'Invita a tu familia o a una persona de confianza a conversar.'},{id:'celular',ico:'📱',title:'Celular',desc:'Comparte una evidencia con tu Eco: texto, dibujo o fotografía.'},{id:'tiquete',ico:'🎟️',title:'Tiquete',desc:'Tu Eco revisa el trayecto y te acompaña a seguir.'}];
function symbols(stageId,compact=false){const byStage={historia:['cuaderno','linterna','carpa','celular'],familia:['cuaderno','carpa','linterna'],capacidades:['cuaderno','lupa','celular'],suenos:['linterna','cuaderno','carpa'],plan:['cuaderno','linterna','tiquete']};const list=stageId?KIT.filter(k=>byStage[stageId].includes(k.id)):KIT;return `<div class="kit-grid ${compact?'compact':''}">${list.map(k=>`<div class="kit-item"><div class="kit-icon" aria-hidden="true">${k.ico}</div><div><strong>${k.title}</strong><span>${k.desc}</span></div></div>`).join('')}</div>`}
function equipajePage(){return `<div class="page-kicker">🎒 MI MOCHILA</div><h1 class="title">El equipaje de tu aventura</h1><p class="lede">Cada objeto tiene una misión. No tienes que llevar cosas costosas: son símbolos que te recuerdan cómo aprender y compartir tus descubrimientos.</p><div class="hero"><div><h2>Prepara tu mochila antes de subir la montaña</h2><p>La cartilla usa estos símbolos para indicar cuándo reflexionar, conversar, escribir o compartir con tu docente.</p><button class="btn accent" data-nav="miRuta">Volver a mis trayectos</button></div><div class="backpack-art" aria-hidden="true">🎒</div></div><div style="height:20px"></div><div class="card"><h3>Tus seis herramientas</h3>${symbols(null,false)}</div><div style="height:18px"></div><div class="callout"><strong>Un recordatorio:</strong> no necesitas compartir información privada que no quieras contar. Puedes hablar con tu Eco si una pregunta te incomoda.</div>`}

function stageIndicatorList(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Trayecto</th><th>Lo que recoge</th><th>Indicador de medición</th><th>¿Para qué sirve?</th></tr></thead><tbody>${STAGES.map(st=>`<tr><td><strong>${st.n}. ${safe(st.short)}</strong></td><td>${safe(st.purpose)}</td><td>${safe(indicatorText(st.id))}</td><td>${safe(decisionUse(st.id))}</td></tr>`).join('')}</tbody></table></div>`}
function decisionUse(id){return ({historia:'Ayuda a detectar jóvenes con capacidad de reflexión, cambios significativos o necesidad de apoyo socioemocional.',familia:'Permite identificar apoyo familiar alto, medio o bajo y posibles barreras de acompañamiento.',capacidades:'Facilita orientar perfiles hacia rutas técnicas, académicas o de liderazgo.',suenos:'Permite ver claridad de metas y barreras para decidir orientación adicional.',plan:'Muestra preparación para vinculación educativa, remisión a Año 12 o seguimiento intensivo.'})[id]}
function routePage(){const st=stageBy(currentStage),s=student(),rec=s.submissions[st.id]||{status:'draft',answers:{}};const ans=Object.assign({},rec.answers,s.drafts[st.id]||{});return `<div class="page-kicker">MI CUADERNO DE VIAJE · PARADA ${st.n}</div><h1 class="title">${safe(st.short)}</h1><p class="lede">Explora a tu ritmo, escribe con tus palabras y guarda lo que quieras recordar. Aquí nadie califica tu historia.</p><div class="tabs">${STAGES.map(x=>`<button class="${currentStage===x.id?'active':''}" data-stage="${x.id}">${x.n}. ${safe(x.short)}</button>`).join('')}</div><div class="two student-activity"><div class="card"><div class="head"><div><h3>📔 Mi cuaderno: ${safe(st.short)}</h3><span class="small muted">${statusLabel(rec.status)}</span></div><span class="badge ${badgeClass(rec.status)}">${statusLabel(rec.status)}</span></div><div class="quote"><strong>Propósito:</strong> ${safe(st.purpose)}</div>${!hasTicketFor(st.id,s)?`<div class="callout" style="margin-top:12px">🎟️ Este trayecto se habilita cuando tu Eco revise el anterior. Puedes conocer las preguntas, pero aún no enviarlo.</div>`:""}<div style="height:16px"></div>${st.prompts.map(f=>fieldHtml(st.id,f,ans[f.k]||'')).join('')}<div class="row"><button class="btn secondary" data-save="${st.id}">Guardar mis respuestas</button><button class="btn accent" data-submit="${st.id}" ${hasTicketFor(st.id,s)?"":'disabled title="Primero necesitas el tiquete anterior"'}>Compartir con mi Eco →</button></div>${rec.feedback?`<div class="help" style="margin-top:14px"><strong>💬 Mensaje de tu Eco</strong><p>${safe(rec.feedback)}</p></div>`:''}<div class="callout" style="margin-top:14px">Comparte únicamente lo que quieras compartir. Si algo te incomoda, puedes conversarlo con tu Eco.</div></div><div class="sidecards"><div class="card"><h3>✨ Tu guía de ideas</h3><p class="small muted">Sugerencias para seguir pensando, no respuestas correctas.</p>${studentCoach(s,st.id)}</div><div class="card"><h3>⛺ Conversemos y reflexionemos</h3><strong class="small">Encuentro con tu red de apoyo</strong><ul>${st.family.map(q=>`<li>${safe(q)}</li>`).join('')}</ul><strong class="small">Un momento para ti</strong><ul>${st.reflection.map(q=>`<li>${safe(q)}</li>`).join('')}</ul></div><div class="card"><h3>🎒 Hoy puedes usar...</h3>${symbols(st.id,true)}</div><div class="card"><div class="ticket"><div><strong>🎟️ Mi tiquete</strong><div class="small muted">${rec.status==='approved'?'¡Tu Eco revisó el trayecto!':'Lo recibirás cuando tu Eco revise lo compartido.'}</div></div><span class="badge ${badgeClass(rec.status)}">${statusLabel(rec.status)}</span></div></div></div></div>`}

function fieldHtml(stageId,f,val){if(f.type==='select'){return `<div class="field"><label>${safe(f.label)}</label>${f.hint?`<small>${safe(f.hint)}</small>`:''}<select data-field="${f.k}" data-stagefield="${stageId}"><option value="">Selecciona</option>${f.opts.map(o=>`<option ${val===o?'selected':''}>${safe(o)}</option>`).join('')}</select></div>`} return `<div class="field"><label>${safe(f.label)}</label>${f.hint?`<small>${safe(f.hint)}</small>`:''}<textarea data-field="${f.k}" data-stagefield="${stageId}">${safe(val)}</textarea></div>`}
function hasTicketFor(stageId,s){const i=STAGES.findIndex(x=>x.id===stageId);return i<=0||s.submissions?.[STAGES[i-1].id]?.status==='approved'}
function statusLabel(s){return ({draft:'Borrador',submitted:'En revisión',approved:'Aprobado'})[s]||'Pendiente'}
function badgeClass(s){return ({draft:'purple',submitted:'yellow',approved:'green'})[s]||'purple'}
function persistDraft(stageId){const s=student(); s.drafts[stageId]=collectAnswers(stageId); save(); toast('Borrador guardado')}
function collectAnswers(stageId){const out={}; document.querySelectorAll(`[data-stagefield="${stageId}"]`).forEach(el=>out[el.dataset.field]=el.value.trim()); return out}
function submitStage(stageId){const s=student();if(!hasTicketFor(stageId,s)){toast('Tu Eco debe revisar el trayecto anterior para habilitar este.');return;} const st=stageBy(stageId); const answers=collectAnswers(stageId); const missing=st.prompts.find(f=>f.req && !answers[f.k]); if(missing){toast('Completa: '+missing.label); return;} s.submissions[stageId]={status:'submitted',answers,feedback:'',date:new Date().toISOString().slice(0,10)}; s.drafts[stageId]=answers; save(); if(stageId==='plan' || stageId==='suenos' || stageId==='capacidades' || stageId==='familia' || stageId==='historia'){s.orientation=buildOrientation(s)} toast('Trayecto enviado al Eco/docente'); render()}
function buildOrientation(s){const a=s.submissions; const score=(v)=>Math.max(40,Math.min(95,v)); const auto = score((a.historia.status==='approved'?84:a.historia.status==='submitted'?74:58)); const red = score((a.familia.answers.apoyo==='Alto'?82:a.familia.answers.apoyo==='Medio'?66:48)); const caps = score((a.capacidades.answers.habilidades||'').length>40?81:62); const proj = score((a.suenos.answers.suenoPrincipal||'').length>35?78:61); const action = score((a.plan.answers.primerPaso||'').length>35?76:52); const scores={autoconocimiento:auto, red:red, capacidades:caps, proyecto:proj, accion:action};
  const avg=Math.round(Object.values(scores).reduce((x,y)=>x+y,0)/5); let route='Año 12 + continuidad';
  if(avg<60) route='Nivelación + orientación'; else if(proj>75 && caps>72 && action>65) route='Universitaria'; else if(caps>70 && proj>65) route='Técnica / tecnológica'; else if(red<55) route='Acompañamiento intensivo + continuidad';
  const reason=[]; if(auto>=75) reason.push('La narrativa de historia de vida muestra autoconocimiento y reflexión.'); else reason.push('Se recomienda fortalecer el autoconocimiento con apoyo del Eco.');
  if(red>=75) reason.push('Existe una red de apoyo familiar favorable para sostener la trayectoria.'); else reason.push('La red de apoyo requiere mayor involucramiento y seguimiento.');
  if(caps>=75) reason.push('Se identifican habilidades y competencias transferibles a trayectorias formativas.');
  if(proj>=72) reason.push('Hay un sueño principal con claridad suficiente para orientar la vinculación educativa.');
  if(action<60) reason.push('El plan de acción aún necesita pasos más concretos y fuentes de apoyo.');
  const actions=['Conversación de devolución entre joven y Eco/docente.'];
  if(route==='Universitaria') actions.push('Explorar admisiones, becas y requisitos de educación superior.');
  if(route==='Técnica / tecnológica') actions.push('Explorar programas técnicos/tecnológicos y articulación con Año 12.');
  if(route==='Año 12 + continuidad') actions.push('Remitir a Año 12 para fortalecer competencias digitales y continuidad.');
  if(route.includes('Nivelación')) actions.push('Definir un plan de nivelación y orientación adicional antes de la remisión.');
  if(red<60) actions.push('Activar llamada o reunión breve con familia / acudiente para alinear apoyos.');
  return {scores, route, reason, actions, validated:false};
}
function previousCohortPage(){return `<div class="page-kicker">Seguimiento</div><h1 class="title">Cohorte de prueba y tablero de Ecos</h1><p class="lede">Aquí se ve cómo la cartilla genera seguimiento por estudiante y también señales agregadas para el Eco/docente y las organizaciones.</p><div class="grid g2"><div class="card"><div class="head"><h3>Cohorte de demostración</h3><span class="badge">${db.students.length} estudiantes de prueba · 5 colegios</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Joven</th><th>Colegio</th><th>Eco</th><th>Avance OSO</th><th>Ruta sugerida</th><th>Remisión</th></tr></thead><tbody>${db.students.map(s=>`<tr><td><strong>${safe(s.name)}</strong><br><span class="small muted">${safe(s.grade)}</span></td><td>${safe(s.school)}</td><td>${safe(s.eco)}</td><td>${progressCell(progressPct(s))}</td><td>${safe(s.orientation?.route||s.route)}</td><td>${safe(s.referral)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="head"><h3>Caseload por Eco</h3><span class="badge green">20 Ecos meta / 5 Ecos en demo</span></div>${ecoTable()}</div></div><div style="height:18px"></div><div class="grid g2"><div class="card"><div class="head"><h3>Indicadores accionables por estudiante</h3><span class="badge purple">Para decisiones del Eco</span></div>${studentIndicatorTable()}</div><div class="card"><div class="head"><h3>Embudo escuela → OSO → continuidad</h3><span class="badge yellow">Vista compartida Enseña / Educamás</span></div>${funnel()}</div></div>`}

ación de transición</td><td>% con plan de acción revisado</td><td>Jóvenes con trayecto 5 revisado / jóvenes orientados</td><td>Definir remisiones prioritarias</td></tr><tr><td>Continuidad</td><td>% de postulación, admisión o matrícula</td><td>Hitos de continuidad / cohortes remitidas</td><td>Medir tránsito educativo</td></tr></tbody></table></div></div><div class="card"><div class="head"><h3>Indicadores para los Ecos/docentes</h3><span class="badge green">Acompañamiento cotidiano</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Indicador</th><th>Pregunta que responde</th><th>Acción posible</th></tr></thead><tbody><tr><td>Jóvenes sin tiquete en trayecto 1 o 2</td><td>¿Quién aún no construye base de autoconocimiento?</td><td>Priorizarlos en tutoría individual</td></tr><tr><td>Red de apoyo baja</td><td>¿Quién necesita involucrar más a la familia o red cercana?</td><td>Llamada o encuentro con acudiente</td></tr><tr><td>Barreras altas y sueño poco claro</td><td>¿Quién necesita más orientación antes de ser remitido?</td><td>Sesión adicional de orientación</td></tr><tr><td>Plan de acción insuficiente</td><td>¿Quién tiene metas poco concretas?</td><td>Co-construir cronograma y pasos inmediatos</td></tr><tr><td>Ruta sugerida validada</td><td>¿Quién está listo para vinculación educativa?</td><td>Remisión a Año 12 o oferta pertinente</td></tr></tbody></table></div></div></div><div style="height:18px"></div><div class="card"><div class="head"><h3>Distribución simulada por estado</h3><span class="badge yellow">Metas y registros separados</span></div><div class="funnel"><div class="bar"><b>Jóvenes diagnosticados</b><div><i style="width:76%;background:#23b6b8"></i></div><span>${s.diagnosed}</span></div><div class="bar"><b>Con orientación emitida</b><div><i style="width:55%;background:#5e91d6"></i></div><span>${s.withOrientation}</span></div><div class="bar"><b>Remitidos a continuidad</b><div><i style="width:13%;background:#efc14a"></i></div><span>${s.referred}</span></div><div class="bar"><b>Postulados / admitidos</b><div><i style="width:6%;background:#2b9d76"></i></div><span>${s.admitted}</span></div></div></div>`}

]}}

function evidenceFor(s){const values=[['Historia de vida','historia','aprendizajes'],['Red de apoyo','familia','red'],['Habilidades','capacidades','habilidades'],['Sueños','suenos','suenoPrincipal'],['Próximo paso','plan','primerPaso']];return values.map(([name,st,key])=>({name,v:answered(s,st,key),stage:st}));}
function reviewSuggestions(s){const x=valuesFor(s);const missing=STAGES.filter(t=>!['submitted','approved'].includes(s.submissions[t.id]?.status));const out=[];if(missing.length)out.push({title:'Completar actividades pendientes',detail:`Falta por compartir: ${missing.map(m=>m.short).join(', ')}. Invita al joven a completar con sus palabras, sin presionarlo por la extensión.`});if(s.submissions.familia?.answers?.apoyo==='Bajo')out.push({title:'Explorar apoyos elegidos por el joven',detail:'Preguntar a quién quiere involucrar (familia, docente u otra persona de confianza), sin tratar una red pequeña como una desventaja automática.'});if(x.barrier==='Costos de estudio')out.push({title:'Buscar información sobre financiación',detail:'Verificar becas, apoyos económicos, costo total y requisitos antes de sugerir una postulación.'});if(x.barrier==='Conectividad')out.push({title:'Facilitar acceso y alternativas',detail:'Ofrecer materiales descargables y apoyo desde la institución educativa.'});if(!answered(s,'plan','primerPaso'))out.push({title:'Convertir la idea en acción',detail:'Conversar sobre una actividad concreta, una fecha y una persona de apoyo para iniciar.'});if(s.meetingRequested)out.push({title:'El joven solicitó orientación',detail:'Agendar una conversación, escuchar su preferencia y registrar acuerdos.'});if(!out.length)out.push({title:'Validar alternativas en conversación',detail:'Contrastar intereses y opciones disponibles; ofrecer al menos dos rutas educativas posibles.'});return out}

function matchReason(s,p){
 const x=s.educationProfile||valuesFor(s);
 const why=[];
 let value=35;
 if(x.area===p.area){value+=35;why.push(`El área ${p.area} coincide con el interés que declaraste.`)}
 else why.push('Es una alternativa de exploración que podrías comparar con tus intereses.');
 if(x.goal==='Ingresar a la universidad' && p.type==='Universitaria' || x.goal==='Estudiar un programa técnico o tecnológico' && p.type==='Tecnológica'){value+=15;why.push('El tipo de formación coincide con tu objetivo actual.');}
 else if(x.goal==='Fortalecerme con Año 12'){value+=8;why.push('Año 12 puede servir para prepararte antes de elegir una carrera.');}
 if(x.barrier==='Conectividad'&&p.mode==='Presencial'){value+=4;why.push('Puedes consultar posibilidades de acceso presencial con tu Eco.');}
 if(x.barrier==='Tiempo o responsabilidades'&&p.mode==='Virtual'){value+=12;why.push('La modalidad virtual podría ofrecer flexibilidad; confirma horarios y requisitos.');}
 if(x.barrier==='Costos de estudio'){why.push('Debes revisar costos, becas y apoyos antes de tomar una decisión.');}
 if(p.territory===s.territory||p.territory==='Nacional'){value+=10;why.push('La ubicación o cobertura declarada parece compatible; verifica disponibilidad.');}
 if(!x.area||x.area==='Todavía estoy explorando'){value-=8;}
 return {value:Math.min(95,value),band:value>=75?'Afinidad inicial alta':value>=60?'Vale la pena explorar':'Otra posibilidad',why};
}
function matchesFor(s){return PATH_CATALOG.map(p=>({...p,match:matchReason(s,p),record:db.matches.find(m=>m.sid===s.id&&m.pid===p.id)})).sort((a,b)=>b.match.value-a.match.value)}

3>${active.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Programa</th><th>Estado</th><th>Eco</th><th>Acción</th></tr></thead><tbody>${active.map(m=>`<tr><td>${safe(programName(m.pid))}</td><td>${safe(m.status)}</td><td>${m.reviewed?'Ruta conversada':'Pendiente'}</td><td><button class="btn sm secondary" data-match-review="${m.sid}|${m.pid}">Revisar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Aún no tiene una alternativa registrada. Puedes revisar las opciones de arriba.</p>'}</div>${metaNote()}`}

function dataSignals(){const res=[];let seq=0;const add=(sid,level,title,detail,owner,action)=>res.push({id:'sig'+(++seq),sid,level,title,detail,owner,action});
for(const s of db.students){const ms=db.matches.filter(m=>m.sid===s.id);const x=s.educationProfile;const step=STAGES.filter(st=>s.submissions[st.id]?.status==='submitted');
 if(s.meetingRequested)add(s.id,'Alta','Conversación solicitada',`${s.name} pidió acompañamiento para revisar alternativas.`, 'Eco / Enseña','Agendar devolución con el joven');
 if(step.length)add(s.id,'Media','Evidencia por revisar',`${s.name} tiene ${step.length} trayecto(s) enviados sin validación.`, 'Eco / Enseña','Revisar evidencias y entregar retroalimentación');
 if(x.barrier==='Costos de estudio'&&ms.some(m=>m.status!=='Matrícula verificada'))add(s.id,'Media','Consulta sobre financiación',`${s.name} solicita información sobre costos y apoyos económicos.`, 'Educamás','Revisar alternativas verificadas de becas y financiación');
 if(ms.some(m=>m.status==='Elegida por joven'&&!m.reviewed))add(s.id,'Media','Carrera elegida sin revisión',`${s.name} eligió una carrera; falta conversar requisitos y pertinencia.`, 'Eco / Enseña','Validar opción y registrar acuerdo con el joven');
 if(ms.some(m=>m.status==='Admisión reportada'))add(s.id,'Alta','Admisión sin matrícula',`${s.name} reporta admisión y falta documentar su matrícula.`, 'Educamás','Verificar soporte de matrícula y continuidad');
 if(s.year12.status==='En formación'&&!ms.length)add(s.id,'Media','Año 12 sin carrera explorada',`${s.name} inició Año 12 sin coincidencia educativa registrada.`, 'Educamás','Programar exploración de carreras e instituciones');
}
return res;}

function ensureSkills5(){
 let changed=false;
 for(let i=0;i<db.students.length;i++){
  const s=db.students[i];
  if(!s.skillEvidence){
   s.skillEvidence={};
   SKILLS5.forEach((skill,j)=>{
    const initial=[39,42,52,47,45,38,51,49,44][i]+[4,-3,6,0,3][j];
    const school=skill.id==='english'||skill.id==='steam';
    const hasFinal=school?i!==5&&i!==8:[0,1,3,4,6].includes(i);
    const increase=[14,18,13,10,16][j]+((i+j)%3)*2;
    s.skillEvidence[skill.id]={before:initial,after:hasFinal?Math.min(95,initial+increase):null,
      recordedBy:'Registro ficticio',phase:skill.phase,updated:'2026-10-23'};
   });
   changed=true;
  }
  if(typeof s.skillReflection!=='string'){s.skillReflection='';changed=true;}
 }
 if(changed){try{save()}catch(e){}}
}

}
function skillPhase5(title){return title==='Formación escolar'?'Enseña por Colombia · formación escolar':title==='Año 12'?'Educamás · Año 12':'Educamás + Ecos · OSO y Año 12'}
function studentSkills5(compact=false){const s=student();return `<div class="skills-student ${compact?'skills-compact':''}"><div class="head"><div><h3>🌟 Así voy fortaleciendo mis habilidades</h3><p class="small muted">Cada experiencia me ayuda a descubrir qué puedo hacer y qué quiero seguir practicando.</p></div><span class="badge green">Mi aprendizaje, a mi ritmo</span></div><div class="skills-student-grid">${SKILLS5.map(k=>{const state=skillStage5(skillRecord5(s,k.id));return `<article class="skill-student-item"><div class="skill-icon">${k.icon}</div><strong>${safe(k.title)}</strong><span class="badge ${state.cls}">${safe(state.label)}</span><p>${safe(state.detail)}</p><div class="skill-small-tip"><strong>✨ Una idea para practicar</strong><br>${safe(k.practice)}</div><div class="skill-small-owner">${safe(skillPhase5(k.phase))}</div></article>`}).join('')}</div>${compact?`<div class="row" style="margin-top:16px"><button class="btn accent" data-nav="misSkills">Ver mis habilidades y actividades →</button></div>`:`<div class="card" style="margin-top:17px;box-shadow:none"><h3>📔 Lo que he aprendido últimamente</h3><p class="small muted">Escribe lo que descubriste de ti y lo que te gustaría aprender después. Es para tu cuaderno; no es una evaluación ni una nota.</p><div class="field"><label for="skill-reflection">Mi reflexión</label><textarea id="skill-reflection" placeholder="Por ejemplo: aprendí a buscar información confiable y quiero mejorar mi inglés...">${safe(s.skillReflection)}</textarea></div><div class="row"><button class="btn accent" data-save-skills="1">Guardar en mi cuaderno</button><button class="btn secondary" data-nav="miAno12">Ver mi Año 12</button></div></div>`}</div>`;}
function studentSkillsPage5(){return `<div class="page-kicker">MI APRENDIZAJE</div><h1 class="title">Lo que ya sé y lo que quiero aprender</h1><p class="lede">La formación escolar y Año 12 se conectan para que sigas descubriendo tus capacidades. Aquí verás ideas para mejorar, sin notas ni indicadores de la organización.</p><section class="hero"><div><h2>¡Cada paso cuenta para llegar a tu próximo destino!</h2><p>Inglés y STEAM te acompañan desde el colegio. En Año 12 podrás practicar tecnología, IA y decisiones sobre tu futuro con tu Eco y tus formadores.</p><div class="row"><button class="btn accent" data-nav="miAno12">Ir a mi Año 12</button><button class="btn secondary" data-nav="opciones">Explorar carreras</button></div></div><div class="hero-mountain"><img src="${OSO_MOUNTAIN_IMAGE}" alt="Montañas del viaje OSO"/></div></section><div style="height:18px"></div><div class="card">${studentSkills5(false)}</div><p class="small muted" style="margin-top:16px">Experiencia de demostración con avances ficticios. Las actividades sirven para aprender y conversar con tu Eco; no son diagnósticos definitivos.</p>`;}
function summarySkills5(items){return SKILLS5.map(k=>{const rows=items.map(s=>skillRecord5(s,k.id));const valid=rows.filter(r=>isMeasured5(r.before)&&isMeasured5(r.after));const improved=valid.filter(r=>Number(r.after)>Number(r.before));const n=valid.length;
 const avgB=n?Math.round(valid.reduce((a,r)=>a+Number(r.before),0)/n):null;
 const avgA=n?Math.round(valid.reduce((a,r)=>a+Number(r.after),0)/n):null;
 return {k,valid:n,baseline:rows.filter(r=>isMeasured5(r.before)).length,avgB,avgA,delta:n?avgA-avgB:null,improved:improved.length,pct:n?Math.round(improved.length/n*100):null}})}
function followAdvice5(s){const pending=SKILLS5.filter(k=>isMeasured5(skillRecord5(s,k.id).before)&&!isMeasured5(skillRecord5(s,k.id).after));if(pending.length){return 'Programar evaluación final en '+pending.slice(0,2).map(k=>k.short).join(' y ')}const stalled=SKILLS5.filter(k=>{const r=skillRecord5(s,k.id);return isMeasured5(r.before)&&isMeasured5(r.after)&&Number(r.after)<=Number(r.before)});if(stalled.length)return 'Ofrecer refuerzo en '+stalled.map(k=>k.short).join(', ');return 'Documentar avances y conectar con próxima ruta educativa';}
function skillsOrgPage5(){const candidates=user().role==='eco'?db.students.filter(s=>s.eco==='Carlos Ríos'):db.students;
 const stats=summarySkills5(candidates);const first=candidates[0];const current=candidates.find(s=>s.id===skillFocus5)||first;if(current)skillFocus5=current.id;
 const pairs=stats.reduce((sum,x)=>sum+x.valid,0);
 const withComplete=candidates.filter(s=>SKILLS5.every(k=>{const r=skillRecord5(s,k.id);return isMeasured5(r.before)&&isMeasured5(r.after)})).length;
 return `<div class="page-kicker">MEDICIÓN FORMATIVA · DEMOSTRACIÓN</div><h1 class="title">Seguimiento de competencias y mejora de aprendizajes</h1><p class="lede">Comparación de evaluaciones iniciales y finales por competencia, separando formación escolar (inglés y STEAM) de Año 12 (digital, IA y decisiones). Las mediciones son ficticias y las cifras de mejora solo usan pares completos.</p><div class="grid g4"><div class="card stat"><span>Perfiles de esta vista</span><strong>${candidates.length}</strong><span>Jóvenes de prueba</span></div><div class="card stat"><span>Evaluaciones comparables</span><strong>${pairs}</strong><span>Pares inicial–final, por competencia</span></div><div class="card stat"><span>Con las 5 áreas comparables</span><strong>${withComplete}</strong><span>Perfiles con dos mediciones en las cinco áreas</span></div><div class="card stat"><span>Áreas de seguimiento</span><strong>5</strong><span>Digital, IA, decisiones, inglés, STEAM</span></div></div><div style="height:18px"></div><div class="card"><div class="head"><div><h3>Comparación por competencia</h3><p class="small muted">Escala demostrativa 0–100; el cambio se expresa en puntos, no como porcentaje de conocimiento.</p></div><span class="badge">Muestra ficticia · no representa 2.400 diagnósticos</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Competencia</th><th>Responsable</th><th>Con evaluación inicial</th><th>Con mediciones comparables</th><th>Inicial promedio</th><th>Final promedio</th><th>Mejora media</th><th>Jóvenes que mejoraron</th></tr></thead><tbody>${stats.map(q=>`<tr><td><strong>${q.k.icon} ${safe(q.k.title)}</strong></td><td>${safe(q.k.owner)}</td><td>${q.baseline}/${candidates.length}</td><td>${q.valid}/${candidates.length}</td><td>${q.avgB??'—'}</td><td>${q.avgA??'—'}</td><td><strong>${q.delta===null?'Pendiente':((q.delta>0?'+':'')+q.delta+' pts')}</strong></td><td>${q.pct===null?'Sin pares':q.improved+' de '+q.valid+' ('+q.pct+' %)'}</td></tr>`).join('')}</tbody></table></div></div><div style="height:18px"></div><div class="grid g2"><div class="card"><h3>Comparación visual inicial → final</h3><p class="small muted">Promedios calculados únicamente con estudiantes que tienen ambas evaluaciones en cada competencia.</p>${stats.map(x=>`<div class="skill-chart-item"><div class="head"><strong>${x.k.icon} ${safe(x.k.title)}</strong><span class="small muted">${x.valid} pares</span></div>${x.valid?`<div class="skill-chart-row"><span>Inicial</span><div class="progress"><i style="width:${x.avgB}%;background:#9eafc7"></i></div><strong>${x.avgB}</strong></div><div class="skill-chart-row"><span>Final</span><div class="progress"><i style="width:${x.avgA}%;background:var(--teal)"></i></div><strong>${x.avgA}</strong></div>`:'<p class="muted small">Aún no hay evaluaciones comparables.</p>'}</div>`).join('')}</div><div class="card"><h3>Alertas y decisiones formativas</h3><p class="small muted">Señales que apoyan al equipo; ninguna sugerencia reemplaza la revisión pedagógica.</p>${SKILLS5.map(k=>{const pending=candidates.filter(s=>{const r=skillRecord5(s,k.id);return isMeasured5(r.before)&&!isMeasured5(r.after)});return `<div class="skill-alert"><strong>${k.icon} ${safe(k.title)}</strong><p>${pending.length} jóvenes con diagnóstico inicial y evaluación final pendiente.</p><span class="badge ${pending.length?'yellow':'green'}">${pending.length?safe(k.next):'Sin pendientes en la muestra'}</span></div>`}).join('')}</div></div><div style="height:18px"></div><div class="card"><div class="head"><div><h3>Registro y acompañamiento por estudiante</h3><p class="small muted">Actualiza evaluaciones de demostración según el rol y deja trazabilidad de quién las registró.</p></div><span class="badge purple">Acceso pedagógico</span></div><div class="field" style="max-width:540px"><label>Estudiante de prueba</label><select id="skills-focus">${candidates.map(s=>`<option value="${s.id}" ${s.id===current?.id?'selected':''}>${safe(s.name)} · ${safe(s.school)}</option>`).join('')}</select></div>${current?skillsEdit5(current):''}</div><div style="height:18px"></div><div class="card"><h3>Seguimiento individual y siguiente acción</h3><div class="table-wrap"><table class="table"><thead><tr><th>Estudiante</th><th>Inglés</th><th>STEAM</th><th>Digital</th><th>IA</th><th>Decisiones</th><th>Acción para el equipo</th></tr></thead><tbody>${candidates.map(s=>`<tr><td><strong>${safe(s.name)}</strong><div class="small muted">${safe(s.school)}</div></td>${['english','steam','digital','ai','decisions'].map(k=>`<td>${shortChange5(skillRecord5(s,k))}</td>`).join('')}<td>${safe(followAdvice5(s))}</td></tr>`).join('')}</tbody></table></div></div>${metaNote()}`;
}
let skillFocus5='s1';
function shortChange5(r){if(!isMeasured5(r.before))return 'Sin inicial';if(!isMeasured5(r.after))return 'Final pendiente';const d=Number(r.after)-Number(r.before);return `<span class="badge ${d>0?'green':'yellow'}">${d>0?'+':''}${d} pts</span>`}
function editableSkill5(k){const role=user().role;return role==='educamas'||(role==='ensena'&&(k.id==='english'||k.id==='steam'))||(role==='eco');}
function skillsEdit5(s){return `<div class="table-wrap"><table class="table"><thead><tr><th>Área</th><th>Etapa</th><th>Evaluación inicial (0–100)</th><th>Evaluación final (0–100)</th><th>Cambio</th></tr></thead><tbody>${SKILLS5.map(k=>{const r=skillRecord5(s,k.id),editable=editableSkill5(k);return `<tr><td><strong>${safe(k.title)}</strong><div class="small muted">${safe(k.owner)}</div></td><td>${safe(k.phase)}</td><td>${editable?`<input aria-label="Inicial ${safe(k.title)}" class="skill-number" type="number" min="0" max="100" step="1" data-skill-input="${k.id}|before" value="${isMeasured5(r.before)?r.before:''}" placeholder="Pendiente"/>`:(isMeasured5(r.before)?r.before:'—')}</td><td>${editable?`<input aria-label="Final ${safe(k.title)}" class="skill-number" type="number" min="0" max="100" step="1" data-skill-input="${k.id}|after" value="${isMeasured5(r.after)?r.after:''}" placeholder="Pendiente"/>`:(isMeasured5(r.after)?r.after:'—')}</td><td>${shortChange5(r)}</td></tr>`}).join('')}</tbody></table></div><div class="row" style="margin-top:14px">${SKILLS5.some(editableSkill5)?'<button class="btn accent" data-save-assess="1">Guardar evaluaciones de prueba</button>':''}<span class="small muted">Las mediciones requieren instrumentos equivalentes y revisión humana antes de usarse en decisiones reales.</span></div>`}
/* Preserve navigation and every former page: add only these small extensions. */
const priorShell51=shell;
shell=function(){const html=priorShell51();const addon=user().role==='joven'?navButton('misSkills','🌟','Mis habilidades'):navButton('skillsOrg','📚','Mejora de competencias');return html.replace('</div><div class="userbox">',addon+'</div><div class="userbox">')};
const priorRenderPage51=renderPage;
renderPage=function(){if(page==='misSkills'){if(user().role!=='joven'){page='home';return priorRenderPage51()}return studentSkillsPage5()}if(page==='skillsOrg'){if(user().role==='joven'){page='home';return priorRenderPage51()}return skillsOrgPage5()}return priorRenderPage51()};
const priorCrumb51=crumbTitle;
crumbTitle=function(){if(page==='misSkills')return 'Mis habilidades';if(page==='skillsOrg')return 'Mejora de competencias';return priorCrumb51()};
const priorHomeStudent51=homeStudent;
homeStudent=function(){return priorHomeStudent51()+`<div class="card" style="margin-top:18px">${studentSkills5(true)}</div>`};
const priorStudentY1251=studentYear12View;
studentYear12View=function(){return priorStudentY1251()+`<div class="card" style="margin-top:18px">${studentSkills5(true)}</div>`};
const priorOrgIndicators51=indicatorsPage;
indicatorsPage=function(){if(user().role==='joven')return priorOrgIndicators51();return priorOrgIndicators51()+`<div class="card" style="margin-top:18px"><h3>📚 Competencias y resultados de aprendizaje</h3><p class="muted">Inglés, STEAM, habilidades digitales, IA responsable y decisiones también forman parte de la medición del proyecto.</p><button class="btn accent" data-nav="skillsOrg">Abrir seguimiento inicial y final</button></div>`};
const priorOrgTransitions51=orgTransitionsPage;
orgTransitionsPage=function(){return priorOrgTransitions51()+`<div class="card" style="margin-top:18px"><h3>📈 De formación a transición educativa</h3><p>Además de los matches, postulaciones y matrículas, revisa la evolución de competencias antes de la continuidad educativa.</p><button class="btn accent" data-nav="skillsOrg">Ver mejora de competencias</button></div>`};
const priorTeacherMatch51=teacherMatchView;
teacherMatchView=function(){return priorTeacherMatch51()+`<div class="card" style="margin-top:18px"><h3>📚 Acompañamiento al aprendizaje</h3><p class="small muted">Consulta avances en inglés, STEAM, tecnología, IA y toma de decisiones de tu grupo.</p><button class="btn accent" data-nav="skillsOrg">Ver habilidades de mis jóvenes</button></div>`};
const previousRender51=render;
render=function(){ensureSkills5();return previousRender51()};
document.addEventListener('click',ev=>{
 const saveReflection=ev.target.closest('[data-save-skills]');
 if(saveReflection){if(user().role!=='joven')return;student().skillReflection=document.querySelector('#skill-reflection')?.value.trim()||'';save();toast('Tu reflexión quedó guardada en el cuaderno.');return}
 const saveAssessment=ev.target.closest('[data-save-assess]');
 if(saveAssessment){if(user().role==='joven')return;const s=db.students.find(x=>x.id===skillFocus5);if(!s)return;
  const fields=[...document.querySelectorAll('[data-skill-input]')];for(const field of fields){if(field.value.trim()!==''&&(!Number.isInteger(Number(field.value))||Number(field.value)<0||Number(field.value)>100)){toast('Usa puntajes enteros entre 0 y 100.');field.focus();return}}
  for(const field of fields){const [k,stage]=field.dataset.skillInput.split('|');const skill=SKILLS5.find(x=>x.id===k);if(!editableSkill5(skill))continue;s.skillEvidence[k][stage]=field.value.trim()===''?null:Number(field.value);s.skillEvidence[k].recordedBy=user().name;s.skillEvidence[k].updated=stamp()}
  logNew('competencias','Evaluaciones de práctica actualizadas por '+user().name+' para '+s.name);save();render();toast('Evaluaciones ficticias guardadas.');return}
});
document.addEventListener('change',ev=>{if(ev.target.id==='skills-focus'){skillFocus5=ev.target.value;render()}});

render();
document.addEventListener('click',(e)=>{const b=e.target.closest('[data-login],[data-nav],[data-logout],[data-reset],[data-stage],[data-save],[data-submit],[data-validate],[data-remit]'); if(!b)return;
  if(b.dataset.login){session=b.dataset.login; saveSession(); page='home'; return render()}
  if(b.dataset.logout){session=''; localStorage.removeItem(SESSION_KEY); return render()}
  if(b.dataset.reset){return resetAll()}
  if(b.dataset.nav){page=b.dataset.nav; return render()}
  if(b.dataset.stage){currentStage=b.dataset.stage; page='miRuta'; return render()}
  if(b.dataset.save){return persistDraft(b.dataset.save)}
  if(b.dataset.submit){return submitStage(b.dataset.submit)}
  if(b.dataset.validate){return validate(b.dataset.validate)}
  if(b.dataset.remit){return remit(b.dataset.remit)}
});
document.addEventListener('change',(event)=>{
  const t=event.target;
  if(t.dataset.explore){student().explore=Object.assign({},valuesFor(student()),{[t.dataset.explore]:t.value});save()}
  if(t.id==='teacher-youth'){detail=t.value;render()}
  if(t.id==='teacher-stage'){currentStage=t.value;render()}
});
document.addEventListener('click',(event)=>{
  const b=event.target.closest('[data-refresh-guide],[data-pick-path],[data-request-eco],[data-mark-stage],[data-save-eco-route]');if(!b)return;
  if('refreshGuide'in b.dataset){save();render();toast('Actualizamos tus ideas con lo que seleccionaste.');return}
  if(b.dataset.pickPath){student().preferredPath=b.dataset.pickPath;save();render();toast('Alternativa guardada para conversar con tu Eco.');return}
  if('requestEco'in b.dataset){student().meetingRequested=true;save();render();toast('Solicitud registrada en el prototipo.');return}
  if(b.dataset.markStage){if(user().role!=='eco')return;const s=db.students.find(x=>x.id===detail),rec=s?.submissions?.[currentStage];if(!rec)return;rec.feedback=document.querySelector('#eco-feedback')?.value.trim()||'';rec.status=b.dataset.markStage;rec.date=new Date().toISOString().slice(0,10);save();render();toast(rec.status==='approved'?'Tiquete validado.':'Reflexión adicional solicitada.');return}
  if(b.dataset.saveEcoRoute){if(user().role!=='eco')return;const s=db.students.find(x=>x.id===b.dataset.saveEcoRoute),r=document.querySelector('#eco-route')?.value||'',agreement=document.querySelector('#eco-agreement')?.value.trim()||'';if(!r){toast('Selecciona primero una alternativa conversada con el joven.');return;}s.humanRoute=r;s.humanAgreement=agreement;s.orientation=buildOrientation(s);s.orientation.validated=true;save();render();toast('Acuerdos compartidos con el joven en la demo.');return}
});

})();
</script>
